<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxify - Downloads</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fd;color:#172033}.shell{min-height:100vh;display:flex}.sidebar{width:285px;background:#1554ad;color:#fff;padding:36px 22px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:14px;margin-bottom:55px}.logo{width:72px;height:72px;background:#fff;color:#1764c0;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800}.brand-name{font-size:30px;font-weight:800}.brand-sub{font-size:12px;letter-spacing:2px;margin-top:6px}.section{margin-bottom:35px}.section-title{font-size:12px;letter-spacing:2px;opacity:.8;margin:0 0 15px 12px}button.nav{width:100%;border:0;background:transparent;color:#fff;padding:15px 14px;border-radius:12px;text-align:left;font-size:17px;cursor:pointer}button.nav:hover{background:rgba(255,255,255,.1)}.active{background:#fff!important;color:#1554ad!important;font-weight:700}.bottom{margin-top:auto}.main{flex:1;padding:35px 55px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.crumb{color:#7790b5;font-size:17px}.crumb strong{color:#172033}button.refresh{border:0;background:#1d78da;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;cursor:pointer}h1{font-size:42px;margin:0 0 8px}.subtitle{color:#71809a;font-size:17px;margin:0 0 28px}.status{display:none;padding:14px 18px;border-radius:12px;margin-bottom:20px}.error{display:block;background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.card{background:#fff;border:1px solid #e4ebf4;border-radius:18px;padding:21px;box-shadow:0 5px 20px rgba(30,55,90,.05)}.row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.type{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:#eef5ff;color:#1d65bd}.name{font-size:18px;font-weight:800;margin:12px 0 8px;word-break:break-word}.meta{font-size:13px;color:#7b879b;line-height:1.7;word-break:break-word}.download{margin-top:17px;border:0;background:#1d78da;color:#fff;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.download[disabled]{opacity:.5;cursor:not-allowed}.empty{background:#fff;border:1px dashed #d7e1ee;border-radius:18px;padding:70px 20px;text-align:center;color:#71809a}@media(max-width:800px){.sidebar{width:225px}.main{padding:25px}.brand-name{font-size:24px}.logo{width:58px;height:58px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<div class="brand"><div class="logo">V</div><div><div class="brand-name">Voxify</div><div class="brand-sub">AI CONTENT PLATFORM</div></div></div>
<div class="section"><div class="section-title">WORKSPACE</div><button class="nav" onclick="location.href='/'">Dashboard</button><button class="nav" onclick="location.href='/'">Translation</button></div>
<div class="section"><div class="section-title">LIBRARY</div><button class="nav" onclick="location.href='/history'">History</button><button class="nav active">Downloads</button></div>
<div class="bottom"><button class="nav" onclick="logout()">Logout</button></div>
</aside>
<main class="main">
<div class="top"><div class="crumb">Library <span>›</span> <strong>Downloads</strong></div><button class="refresh" onclick="loadFiles()">↻ Refresh</button></div>
<h1>Downloads</h1><p class="subtitle">Your stored Voxify files and generated results.</p>
<div id="error" class="status"></div><div id="content"></div>
</main>
</div>
<script>
const API_BASE_URL=`${window.location.protocol}//${window.location.hostname}:8000/api/v1`;
function token(){return localStorage.getItem("access_token")||localStorage.getItem("voxify_access_token");}
function logout(){localStorage.removeItem("access_token");localStorage.removeItem("voxify_access_token");localStorage.removeItem("user_email");localStorage.removeItem("preferred_language");location.replace("/pages/login.html");}
function typeName(item){const mime=(item.mime_type||"").toLowerCase();if(mime.includes("pdf"))return "PDF";if(mime.startsWith("audio/"))return "Audio";if(mime.startsWith("text/"))return "Text";if(mime.startsWith("image/"))return "Image";if(mime.startsWith("video/"))return "Video";return "File";}
function formatSize(bytes){const n=Number(bytes||0);if(!n)return "0 KB";if(n<1024*1024)return (n/1024).toFixed(1)+" KB";return (n/(1024*1024)).toFixed(1)+" MB";}
function formatDate(value){if(!value)return "";const d=new Date(value);return Number.isNaN(d.getTime())?value:d.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];});}
async function loadFiles(){const t=token();if(!t){location.replace("/pages/login.html");return;}const error=document.getElementById("error");const content=document.getElementById("content");error.style.display="none";content.innerHTML="<div class='empty'>Loading your downloads...</div>";try{const res=await fetch(API_BASE_URL+"/storage/files",{headers:{Authorization:"Bearer "+t,Accept:"application/json"}});const data=await res.json();if(!res.ok||!data.success)throw new Error(data.detail||"Failed to load downloads.");const files=Array.isArray(data.data)?data.data:[];if(!files.length){content.innerHTML="<div class='empty'><h2>No downloads yet</h2><p>Files you upload or generate in Voxify will appear here.</p></div>";return;}const grid=document.createElement("div");grid.className="grid";files.forEach(function(item){const card=document.createElement("div");card.className="card";const safeName=escapeHtml(item.file_name||"Unnamed file");card.innerHTML="<div class='row'><span class='type'>"+typeName(item)+"</span><span class='meta'>"+formatSize(item.file_size)+"</span></div><div class='name'>"+safeName+"</div><div class='meta'>"+escapeHtml(item.storage_path||"")+"<br>"+escapeHtml(formatDate(item.created_at))+"</div>";const button=document.createElement("button");button.className="download";button.textContent="↓ Download";button.disabled=!item.download_url;button.onclick=function(){downloadFile(item.id,item.file_name||"voxify-file");};card.appendChild(button);grid.appendChild(card);});content.innerHTML="";content.appendChild(grid);}catch(err){error.textContent=err.message||"Failed to load downloads.";error.className="status error";content.innerHTML="";}}
async function downloadFile(fileId,fileName){
  const t=token();
  if(!t||!fileId)return;
  try{
    const res=await fetch(API_BASE_URL+"/storage/download/"+encodeURIComponent(fileId),{
      headers:{Authorization:"Bearer "+t,Accept:"application/json"}
    });
    const data=await res.json();
    if(!res.ok||!data.success||!data.data?.download_url)throw new Error(data.detail||"Download failed.");
    const a=document.createElement("a");
    a.href=data.data.download_url;
    a.download=fileName||data.data.file_name||"voxify-file";
    a.target="_blank";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(err){
    const error=document.getElementById("error");
    error.textContent=err.message||"Download failed.";
    error.className="status error";
    error.style.display="block";
  }
}
loadFiles();
</script>
</body>
</html>
